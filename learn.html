<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learn Nexus.js — Interactive Tutorial</title>
  <meta name="description" content="Learn Nexus.js with interactive code examples. Master islands architecture, server actions, and reactive state with Svelte 5 runes.">
  <link rel="canonical" href="https://nexusjs.dev/learn">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- Monaco Editor CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/editor/editor.main.min.css">
  
  <!-- Learn page styles -->
  <link rel="stylesheet" href="/nexus-site.css">
  
  <style>
    body { margin: 0; padding: 0; overflow: hidden; }
    
    .learn-shell {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: #0a0a0a;
    }
    
    .learn-topbar {
      background: #18181b;
      border-bottom: 1px solid #27272a;
      padding: 1rem 2rem;
      flex-shrink: 0;
    }
    
    .learn-topbar__inner {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2rem;
    }
    
    .learn-topbar__titles {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    
    .learn-badge {
      background: #7c3aed;
      color: white;
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    .learn-topbar__title {
      color: white;
      font-size: 1.25rem;
      font-weight: 700;
      margin: 0;
    }
    
    .learn-topbar__hint {
      color: #a1a1aa;
      font-size: 0.875rem;
      margin: 0;
      flex: 1;
    }
    
    .learn-topbar__link {
      color: #7c3aed;
      text-decoration: none;
      font-weight: 600;
      white-space: nowrap;
    }
    
    .learn-topbar__link:hover {
      color: #9333ea;
    }
    
    .learn-root {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    
    .learn-sidebar {
      width: 280px;
      background: #18181b;
      border-right: 1px solid #27272a;
      overflow-y: auto;
      flex-shrink: 0;
    }
    
    .ls-header {
      padding: 1.5rem 1rem;
      border-bottom: 1px solid #27272a;
    }
    
    .ls-header__label {
      color: white;
      font-size: 0.875rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin: 0 0 1rem 0;
    }
    
    .ls-progress {
      height: 4px;
      background: #27272a;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 0.5rem;
    }
    
    .ls-progress__bar {
      height: 100%;
      background: linear-gradient(to right, #7c3aed, #9333ea);
      width: 0%;
      transition: width 0.3s ease;
    }
    
    .ls-progress__label {
      color: #71717a;
      font-size: 0.75rem;
      margin: 0;
    }
    
    .ls-nav {
      padding: 1rem 0;
    }
    
    .ls-group {
      margin-bottom: 1.5rem;
    }
    
    .ls-group h3 {
      color: #71717a;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin: 0 1rem 0.5rem 1rem;
    }
    
    .ls-item {
      width: 100%;
      padding: 0.75rem 1rem;
      background: none;
      border: none;
      color: #a1a1aa;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-family: inherit;
      font-size: 0.875rem;
      transition: all 0.2s;
    }
    
    .ls-item:hover {
      background: #27272a;
      color: white;
    }
    
    .ls-item.active {
      background: #7c3aed;
      color: white;
    }
    
    .ls-num {
      color: #71717a;
      font-size: 0.75rem;
      font-weight: 600;
    }
    
    .ls-item.active .ls-num {
      color: rgba(255,255,255,0.7);
    }
    
    .ls-check {
      margin-left: auto;
      color: #22c55e;
    }
    
    .learn-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    .learn-desc {
      background: #18181b;
      border-bottom: 1px solid #27272a;
      padding: 1.5rem 2rem;
      overflow-y: auto;
      flex-shrink: 0;
      max-height: 300px;
    }
    
    .ld-inner {
      max-width: 900px;
      margin: 0 auto;
    }
    
    .ld-breadcrumb {
      color: #71717a;
      font-size: 0.75rem;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    .ld-sep {
      margin: 0 0.5rem;
    }
    
    .ld-title {
      color: white;
      font-size: 1.5rem;
      font-weight: 700;
      margin: 0 0 1rem 0;
    }
    
    .ld-body {
      color: #d4d4d8;
      line-height: 1.7;
    }
    
    .ld-body p {
      margin: 0 0 1rem 0;
    }
    
    .ld-body code {
      background: #27272a;
      padding: 0.125rem 0.375rem;
      border-radius: 0.25rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.875em;
    }
    
    .ld-nav {
      display: flex;
      gap: 1rem;
      margin-top: 1.5rem;
    }
    
    .ld-btn {
      padding: 0.5rem 1rem;
      background: #27272a;
      color: white;
      border: none;
      border-radius: 0.375rem;
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .ld-btn:hover:not(:disabled) {
      background: #3f3f46;
    }
    
    .ld-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .ld-btn--next {
      background: #7c3aed;
    }
    
    .ld-btn--next:hover:not(:disabled) {
      background: #9333ea;
    }
    
    .learn-workspace {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      overflow: hidden;
    }
    
    .editor-pane,
    .preview-pane {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    .editor-pane {
      border-right: 1px solid #27272a;
    }
    
    .pane-header {
      background: #18181b;
      border-bottom: 1px solid #27272a;
      padding: 0.75rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    
    .pane-header__file {
      color: #a1a1aa;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.875rem;
    }
    
    .pane-header__actions {
      display: flex;
      gap: 0.5rem;
    }
    
    .pane-btn {
      padding: 0.375rem 0.75rem;
      background: #27272a;
      color: white;
      border: none;
      border-radius: 0.25rem;
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .pane-btn:hover {
      background: #3f3f46;
    }
    
    .pane-btn--run {
      background: #7c3aed;
    }
    
    .pane-btn--run:hover {
      background: #9333ea;
    }
    
    .monaco-host {
      flex: 1;
      overflow: hidden;
    }
    
    .preview-iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: white;
    }
  </style>
</head>
<body>

<div class="learn-shell">
  <header class="learn-topbar">
    <div class="learn-topbar__inner">
      <div class="learn-topbar__titles">
        <span class="learn-badge">Interactive</span>
        <p class="learn-topbar__title">Learn Nexus.js</p>
      </div>
      <p class="learn-topbar__hint">Edit code on the left — <strong>Run</strong> updates the preview (simulated)</p>
      <a href="/" class="learn-topbar__link">← Back to Docs</a>
    </div>
  </header>

  <div class="learn-root">
    <!-- Sidebar -->
    <aside class="learn-sidebar">
      <div class="ls-header">
        <h2 class="ls-header__label">Lessons</h2>
        <div class="ls-progress">
          <div class="ls-progress__bar" id="progress-bar"></div>
        </div>
        <p class="ls-progress__label" id="progress-label">0 / 12</p>
      </div>
      <nav class="ls-nav">
        <div class="ls-group">
          <h3>Foundations</h3>
          <button class="ls-item active" data-lesson="0"><span class="ls-num">01</span><span>Your First Page</span><span class="ls-check" id="chk-0"></span></button>
          <button class="ls-item" data-lesson="1"><span class="ls-num">02</span><span>Server Frontmatter</span><span class="ls-check" id="chk-1"></span></button>
          <button class="ls-item" data-lesson="2"><span class="ls-num">03</span><span>File-based Routing</span><span class="ls-check" id="chk-2"></span></button>
        </div>
        <div class="ls-group">
          <h3>Interactivity</h3>
          <button class="ls-item" data-lesson="3"><span class="ls-num">04</span><span>Islands Architecture</span><span class="ls-check" id="chk-3"></span></button>
          <button class="ls-item" data-lesson="4"><span class="ls-num">05</span><span>Reactive State</span><span class="ls-check" id="chk-4"></span></button>
          <button class="ls-item" data-lesson="5"><span class="ls-num">06</span><span>Computed Values</span><span class="ls-check" id="chk-5"></span></button>
        </div>
        <div class="ls-group">
          <h3>Server & Data</h3>
          <button class="ls-item" data-lesson="6"><span class="ls-num">07</span><span>Server Actions</span><span class="ls-check" id="chk-6"></span></button>
          <button class="ls-item" data-lesson="7"><span class="ls-num">08</span><span>Form Validation</span><span class="ls-check" id="chk-7"></span></button>
          <button class="ls-item" data-lesson="8"><span class="ls-num">09</span><span>Authentication</span><span class="ls-check" id="chk-8"></span></button>
        </div>
        <div class="ls-group">
          <h3>Advanced</h3>
          <button class="ls-item" data-lesson="9"><span class="ls-num">10</span><span>Pretext & Data</span><span class="ls-check" id="chk-9"></span></button>
          <button class="ls-item" data-lesson="10"><span class="ls-num">11</span><span>Layouts</span><span class="ls-check" id="chk-10"></span></button>
          <button class="ls-item" data-lesson="11"><span class="ls-num">12</span><span>Navigation</span><span class="ls-check" id="chk-11"></span></button>
        </div>
      </nav>
    </aside>

    <!-- Main -->
    <div class="learn-main">
      <div class="learn-desc">
        <div class="ld-inner">
          <div class="ld-breadcrumb">
            <span>Tutorial</span>
            <span class="ld-sep">›</span>
            <span id="lesson-step">01 / 12</span>
          </div>
          <h1 id="lesson-title" class="ld-title">Your First Page</h1>
          <div id="lesson-body" class="ld-body"></div>
          <div class="ld-nav">
            <button class="ld-btn ld-btn--prev" id="btn-prev">← Prev</button>
            <button class="ld-btn ld-btn--next" id="btn-next">Next →</button>
          </div>
        </div>
      </div>

      <div class="learn-workspace">
        <div class="editor-pane">
          <div class="pane-header">
            <span class="pane-header__file" id="editor-filename">+page.nx</span>
            <div class="pane-header__actions">
              <button class="pane-btn" id="btn-reset">Reset</button>
              <button class="pane-btn pane-btn--run" id="btn-run">▶ Run</button>
            </div>
          </div>
          <div id="monaco-editor" class="monaco-host"></div>
        </div>
        <div class="preview-pane">
          <div class="pane-header">
            <span>Preview</span>
            <button class="pane-btn" id="btn-refresh">⟳</button>
          </div>
          <iframe id="preview-iframe" class="preview-iframe" sandbox="allow-scripts allow-same-origin"></iframe>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Monaco Editor AMD Loader -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>

<!-- Learn page logic -->
<script src="/learn.js"></script>

</body>
</html>
